apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bombsquad-teams-data
  namespace: bombsquad
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bombsquad-teams
  namespace: bombsquad
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bombsquad-teams
  template:
    metadata:
      labels:
        app: bombsquad-teams
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: bombsquad-teams
          image: ghcr.io/abexamir/bombsquad-dockerized:latest
          ports:
            - containerPort: 43210
              protocol: UDP
          env:
            - name: PARTY_NAME
              value: "Teams 9-Round Server"
            - name: SESSION_TYPE
              value: "teams"
            - name: TEAMS_SERIES_LENGTH
              value: "9"
            - name: MAX_PARTY_SIZE
              value: "17"
            - name: SESSION_MAX_PLAYERS_OVERRIDE
              value: "16"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bombsquad-teams-data
---
apiVersion: v1
kind: Service
metadata:
  name: bombsquad-teams
  namespace: bombsquad
spec:
  type: LoadBalancer
  selector:
    app: bombsquad-teams
  ports:
    - name: game
      port: 43212
      targetPort: 43210
      protocol: UDP
